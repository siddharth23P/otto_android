# Nightly and on otto bumps: the bridge against the pinned otto and the last
# three releases on PyPI, so a release that breaks the contract is known the
# day it ships rather than when someone updates.
name: compat

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["app/src/main/python/**"]

permissions:
  contents: read

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - id: list
        run: |
          python -m pip install --quiet --disable-pip-version-check packaging
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, time, urllib.error, urllib.request

          from packaging.version import InvalidVersion, Version

          URL = "https://pypi.org/pypi/otto-cli-agent/json"
          FLOOR = Version("0.1.2")


          def published():
              """PyPI's releases, or None while otto is not on PyPI yet."""
              problem = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(URL, timeout=30) as response:
                          return json.load(response)["releases"]
                  except urllib.error.HTTPError as error:
                      # 404 is the one answer that means "not published yet".
                      # A 5xx is PyPI having a bad day, and reading that as
                      # "nothing to test" is how this job goes quietly green
                      # while testing nothing it exists to test.
                      if error.code == 404:
                          return None
                      problem = error
                  except (urllib.error.URLError, TimeoutError, ValueError, KeyError) as error:
                      problem = error
                  if attempt < 2:
                      time.sleep(2**attempt)
              print(f"::error::compat could not read {URL}: {problem!r}", file=sys.stderr)
              raise SystemExit(1)


          def installable(releases):
              """The stable releases at or above the floor, oldest first."""
              found = []
              for raw, files in releases.items():
                  try:
                      version = Version(raw)
                  except InvalidVersion:
                      continue
                  # is_prerelease covers dev builds as well as a/b/rc. None of
                  # them is what a phone would install, so none of them may
                  # take one of the three slots a real release is owed.
                  if version.is_prerelease or version < FLOOR:
                      continue
                  # PyPI keeps the version number of a release whose files it
                  # no longer serves. With no files left the install fails
                  # outright; with every file yanked pip still installs it
                  # from our exact pin, and the job reports on a release its
                  # author withdrew.
                  if not files or all(file.get("yanked", False) for file in files):
                      continue
                  found.append((version, raw))
              found.sort(key=lambda pair: pair[0])
              return [raw for _, raw in found]


          releases = published()
          versions = installable(releases or {})[-3:]
          if not versions:
              # otto is on PyPI from 0.1.2; nothing to test is a failure, not a pass.
              print(f"::error::no installable otto release at or above {FLOOR}", file=sys.stderr)
              raise SystemExit(1)
          print("versions=" + json.dumps(versions))
          PY
  bridge:
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otto: ${{ fromJson(needs.releases.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install "otto-cli-agent==${{ matrix.otto }}"
          pip install pytest
      - run: pytest -q app/src/main/python/tests
