# Nightly and on otto bumps: the bridge against the pinned otto and the last
# three releases on PyPI, so a release that breaks the contract is known the
# day it ships rather than when someone updates.
name: compat

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["app/src/main/python/**", "requirements-otto-git.txt"]

permissions:
  contents: read

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - id: list
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, time, urllib.error, urllib.request

          URL = "https://pypi.org/pypi/otto-cli-agent/json"


          def published():
              """PyPI's releases, or None while otto is not on PyPI yet."""
              problem = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(URL, timeout=30) as response:
                          return json.load(response)["releases"]
                  except urllib.error.HTTPError as error:
                      # 404 is the one answer that means "not published yet".
                      # A 5xx is PyPI having a bad day, and reading that as
                      # "nothing to test" is how this job goes quietly green
                      # while testing nothing it exists to test.
                      if error.code == 404:
                          return None
                      problem = error
                  except (urllib.error.URLError, TimeoutError, ValueError, KeyError) as error:
                      problem = error
                  if attempt < 2:
                      time.sleep(2**attempt)
              print(f"::error::compat could not read {URL}: {problem!r}", file=sys.stderr)
              raise SystemExit(1)


          def number(version):
              return tuple(int(part) for part in version.split(".")[:3] if part.isdigit())


          releases = published()
          if releases is None:
              versions = ["git"]
          else:
              versions = sorted((v for v in releases if number(v) >= (0, 2, 0)), key=number)[-3:] or ["git"]
          print("versions=" + json.dumps(versions))
          PY
  bridge:
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otto: ${{ fromJson(needs.releases.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          if [ "${{ matrix.otto }}" = "git" ]; then pip install -r requirements-otto-git.txt; else pip install "otto-cli-agent==${{ matrix.otto }}"; fi
          pip install pytest
      - run: pytest -q app/src/main/python/tests
