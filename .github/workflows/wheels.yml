# The Android wheels otto needs that PyPI does not carry (pydantic-core, jiter,
# orjson, ormsgpack, tiktoken, uuid-utils, zstandard and numpy, whose own CI
# builds for Android but whose releases are not published for it) plus the
# pure-Python otto wheel from the pinned ref. One job per package so a failure
# names its package. A green run on a tag ref publishes the whole set as a
# GitHub Release: the binaries stay out of the repository, and wheels/wheels.json
# names the release and the digest of every file the build downloads.
name: wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the set as a GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish or update"
        default: wheels-cp313-otto-0.2.0
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/wheels.yml", "app/src/main/python/requirements.txt", "requirements-otto-git.txt"]

permissions:
  contents: read

env:
  CIBW_PLATFORM: android
  CIBW_ARCHS: "arm64_v8a x86_64"
  CIBW_BUILD: "cp313-*"
  CIBW_BUILD_FRONTEND: "build[uv]"
  # The import test needs an emulator; this job answers "does it build" and
  # emulator.yml answers "does it load".
  CIBW_TEST_SKIP: "*"
  ANDROID_API_LEVEL: "24"
  # Android requires 16 KB page alignment for targetSdk 35 on Google Play.
  CIBW_ENVIRONMENT: "LDFLAGS='-Wl,-z,max-page-size=16384' RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'"

jobs:
  compiled:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pydantic-core, jiter, orjson, ormsgpack, tiktoken, uuid-utils, zstandard, numpy]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; setup-android
      # is not needed and its default package list names one the SDK
      # no longer has ('tools'), which failed every build.
      - uses: astral-sh/setup-uv@v6   # the build[uv] frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Resolve the version otto's lock needs
        id: version
        run: |
          pip install -r requirements-otto-git.txt 2>/dev/null || pip install -r app/src/main/python/requirements.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.metadata as m
          name = "${{ matrix.package }}"
          try:
              print("version=" + m.version(name))
          except m.PackageNotFoundError:
              print("version=")
          PY
      - name: Fetch the sdist
        run: |
          pip download --no-binary :all: --no-deps -d sdist "${{ matrix.package }}==${{ steps.version.outputs.version }}"
          mkdir -p src && tar -xzf sdist/*.tar.gz -C src --strip-components=1
      - name: Build with cibuildwheel for Android
        env:
          # numpy keeps its Android build settings in its own [tool.cibuildwheel.android]
          # tables, so they are kept (see the strip step) -- but its CI builds against an
          # OpenBLAS built for Android, which we do not carry. numpy's internal fallback
          # routines are allowed instead: otto uses numpy for dot products and argsort over
          # a few hundred floats (agent/memory), where a slower BLAS costs nothing.
          CIBW_CONFIG_SETTINGS_ANDROID: ${{ matrix.package == 'numpy' && 'setup-args=-Dallow-noblas=true setup-args=-Duse-ilp64=false build-dir=build' || '' }}
        run: |
          pip install cibuildwheel
          # An sdist's own [tool.cibuildwheel] is written for the version its
          # maintainers use: zstandard names the enable group
          # "cpython-freethreading", which cibuildwheel 4 no longer knows and
          # refuses to parse. Dropping the tables is the fix for that one, and
          # the wrong move for numpy, whose Android settings live in them --
          # without them meson reaches a check it can only answer by running an
          # Android binary on the runner (_core/meson.build, "Can not run test
          # applications in this cross environment", 2026-09-16).
          python - "${{ matrix.package }}" <<'PY'
          import re, sys, pathlib
          keep = {"numpy"}
          package = sys.argv[1]
          p = pathlib.Path("src/pyproject.toml")
          if package in keep:
              # Keep the settings, drop the hooks: numpy's before-build installs an Android
              # OpenBLAS we do not use and calls `python -m pip` in a venv uv built without
              # pip, which fails before anything is compiled (2026-09-16). Same for the test
              # hooks, which want a device.
              text = p.read_text()
              cleaned = re.sub(r'(?m)^(before-build|before-test|test-command|test-requires)\s*=.*(?:\n(?![A-Za-z\[]).*)*\n', "", text)
              # And say it in the file rather than only in the environment: the table asks for a
              # BLAS we do not carry, and one source of truth beats trusting an override order.
              cleaned = cleaned.replace("-Dallow-noblas=false", "-Dallow-noblas=true")
              if cleaned != text:
                  p.write_text(cleaned)
              print(f"kept {package}'s [tool.cibuildwheel] settings, dropped its hooks and its BLAS requirement")
          elif p.exists():
              text = p.read_text()
              cleaned = re.sub(r"(?ms)^\[tool\.cibuildwheel(?:\.[^\]]*)?\]\n.*?(?=^\[|\Z)", "", text)
              if cleaned != text:
                  p.write_text(cleaned)
                  print("dropped the sdist's [tool.cibuildwheel] tables")
          PY
          # numpy 2.5.3's meson reads `longdouble_format` from a cross-file property and, finding
          # none, runs a test binary to detect it -- which no cross build can do
          # (_core/meson.build:507, "Can not run test applications in this cross environment").
          # numpy's own Android branch hard-codes IEEE_QUAD_LE for 64-bit Android, but it landed
          # upstream after 2.5.3 shipped, so the property is supplied here instead, for the two
          # 64-bit ABIs this builds. numpy's cross-compilation docs name this exact property.
          if [ "${{ matrix.package }}" = "numpy" ]; then
            cat > "$PWD/android-cross.ini" <<'INI'
          [properties]
          longdouble_format = 'IEEE_QUAD_LE'
          INI
            export CIBW_CONFIG_SETTINGS_ANDROID="$CIBW_CONFIG_SETTINGS_ANDROID setup-args=--cross-file=$PWD/android-cross.ini"
          fi
          cd src && cibuildwheel --output-dir ../wheelhouse
      - name: Check 16 KB LOAD alignment on every native library
        run: |
          pip install wheel
          for whl in wheelhouse/*.whl; do
            python -m wheel unpack "$whl" -d unpacked
          done
          bad=0
          for so in $(find unpacked -name '*.so'); do
            if llvm-readelf -l "$so" 2>/dev/null | awk '/LOAD/ && $NF != "0x4000" && $NF != "0x10000" {found=1} END {exit !found}'; then echo "4 KB-aligned: $so"; bad=1; fi
          done
          exit $bad
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.package }}
          path: wheelhouse/*.whl

  otto-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the pure-Python otto wheel from the pinned ref
        run: |
          pip install build
          ref=$(sed -n 's/.*@\([0-9a-f]\{7,40\}\).*/\1/p' requirements-otto-git.txt | head -1)
          git clone https://github.com/siddharth23P/otto_agent src && cd src && git checkout "${ref:-main}"
          python -m build --wheel --outdir ../wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-otto
          path: wheelhouse/*.whl

  publish:
    # The wheel set as one checksummed Release, which app/build.gradle.kts downloads by the digests in
    # wheels/wheels.json. Only on demand: a nightly run answers "do they still build", not "ship this".
    needs: [compiled, otto-wheel]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: all
      - name: Gather the set and write its manifest
        run: |
          mkdir -p wheelhouse
          find all -name '*.whl' -exec cp {} wheelhouse/ \;
          ls -l wheelhouse
          python - <<'PY' > wheels/wheels.json
          import hashlib, json, os, pathlib
          files = sorted(pathlib.Path("wheelhouse").glob("*.whl"))
          print(json.dumps({
              "comment": "The Android wheel set the embedded runtime installs. Built by "
                         ".github/workflows/wheels.yml and published as a GitHub Release; the build downloads "
                         "what it needs into app/build/wheels and checks every file against these digests. "
                         "The .whl files themselves are never committed.",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["TAG"],
              "python": "cp313",
              "abis": ["arm64_v8a", "x86_64"],
              "files": [{"name": p.name, "size": p.stat().st_size,
                         "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=1))
          PY
          cat wheels/wheels.json
        env:
          TAG: ${{ inputs.tag }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" wheelhouse/*.whl --clobber \
            || gh release create "$TAG" wheelhouse/*.whl --title "$TAG" --notes "Android wheels for CPython 3.13 (arm64_v8a, x86_64), built by wheels.yml. app/build.gradle.kts downloads these by the digests in wheels/wheels.json."
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-manifest
          path: wheels/wheels.json

  summary:
    needs: [compiled, otto-wheel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all
      - name: Write the table
        run: |
          {
            echo "## Android wheels"
            echo
            echo "| package | wheels |"
            echo "| --- | --- |"
            for d in all/*; do echo "| $(basename "$d" | sed 's/^wheels-//') | $(ls "$d" | tr '\n' ' ') |"; done
          } >> "$GITHUB_STEP_SUMMARY"
