# Nightly, by hand, and on otto bumps: install the debug APK on an emulator,
# enable the accessibility service, and run the instrumented smoke test. The
# nightly run is the only thing that answers "does the app still start on a
# device" for a change to the app itself; the label answers it for otto.
name: emulator

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  smoke:
    # The gate is only here to pick the one label worth an emulator out of
    # every label a pull request gets. Naming the events that may run instead
    # is how this job came to skip everything that was not a dispatch.
    if: github.event_name != 'pull_request' || github.event.label.name == 'otto-bump'
    runs-on: ubuntu-latest
    strategy:
      # One level failing is a fact about that level, so let the other finish
      # and say whether it is the app or the platform that moved.
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy compiles the app's Python with a build-time interpreter of
      # the same version as the one it embeds.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # The two levels the app declares: minSdk 30, the oldest platform it
      # claims to run on, and targetSdk 35, which decides which of the
      # platform's behaviour changes apply to us. An accessibility service
      # is reached by both ends. compileSdk 37 is not booted -- it says what
      # the app may call, not how it runs -- and android-37 publishes no
      # "default" system image, only google_apis, so a bump that far has to
      # name a target: here as well.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          script: |
            ./gradlew --no-daemon installDebug
            adb shell settings put secure enabled_accessibility_services dev.otto.phone/dev.otto.phone.access.OttoAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -n dev.otto.phone/.ui.MainActivity
            sleep 8
            mkdir -p shots
            adb exec-out screencap -p > shots/1-disclosure-top.png
            # The accept button is the last thing in a long scroll.
            for _ in 1 2 3; do adb shell input swipe 540 1800 540 500 250; sleep 1; done
            adb exec-out screencap -p > shots/2-disclosure-end.png
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null
            adb pull /sdcard/ui.xml ui.xml > /dev/null
            tap=$(python3 - <<'PY'
            import re, sys
            xml = open("ui.xml", encoding="utf-8").read()
            hit = re.search(r'text="I understand, continue".*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            if not hit:
                sys.exit("accept button not in the dump")
            x1, y1, x2, y2 = map(int, hit.groups())
            print((x1 + x2) // 2, (y1 + y2) // 2)
            PY
            )
            adb shell input tap $tap
            sleep 6
            adb exec-out screencap -p > shots/3-setup.png
            for _ in 1 2; do adb shell input swipe 540 1800 540 500 250; sleep 1; done
            adb exec-out screencap -p > shots/4-setup-end.png
            adb shell dumpsys accessibility | grep -q OttoAccessibilityService
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ matrix.api-level }}
          path: shots/*.png
          if-no-files-found: error
