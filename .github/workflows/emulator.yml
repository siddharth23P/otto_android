# By hand and on otto bumps: install the debug APK on an emulator, enable the
# accessibility service, and run the instrumented smoke test.
name: emulator

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'otto-bump'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            ./gradlew --no-daemon installDebug
            adb shell settings put secure enabled_accessibility_services dev.otto.phone/dev.otto.phone.access.OttoAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -n dev.otto.phone/.ui.MainActivity
            sleep 5
            adb shell dumpsys accessibility | grep -q OttoAccessibilityService
