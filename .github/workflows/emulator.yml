# Nightly, by hand, and on labelled pull requests: a whole turn on an emulator (#14). The debug build
# runs a scripted-model turn through the embedded runtime and the real phone tools at both API levels
# the app declares; the shrunk release build ("minified") runs it on a 16 KB page-size image, so
# neither shrinking nor page alignment can break a release unseen. Budgets: the pipeline imports in
# under 8 s, the app holds at most 350 MB after a turn, an APK is at most 75 MB per ABI.
name: emulator

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  smoke:
    # Only the labels worth an emulator: otto bumps, and a person asking for it.
    if: github.event_name != 'pull_request' || github.event.label.name == 'otto-bump' || github.event.label.name == 'emulator'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      # One level failing is a fact about that level, so let the others finish.
      fail-fast: false
      matrix:
        include:
          # minSdk and targetSdk, as a developer builds it.
          - { api-level: 30, target: default, build: debug }
          - { api-level: 35, target: default, build: debug }
          # The shrunk release build, and 16 KB pages, each on its own so a failure names its cause.
          - { api-level: 35, target: default, build: minified }
          - { api-level: 35, target: google_apis_ps16k, build: debug }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy compiles the app's Python with a build-time interpreter of
      # the same version as the one it embeds.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # compileSdk 37 is not booted -- it says what the app may call, not how it runs.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: .github/scripts/emulator-smoke.sh ${{ matrix.build }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.build }}
          path: smoke/
          if-no-files-found: ignore
      - name: Budgets
        if: always()
        run: |
          { echo "## API ${{ matrix.api-level }} ${{ matrix.target }} (${{ matrix.build }})"; echo; echo '```'; cat smoke/budgets.txt 2>/dev/null || echo "no budgets recorded"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
